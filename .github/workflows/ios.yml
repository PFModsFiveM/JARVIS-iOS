# Builds the app on a GitHub-hosted Mac, because there is no Mac here.
#
#   test   - compiles the app and runs JARVISTests (the crypto vectors the PC computed) on a Simulator
#   ipa    - builds an UNSIGNED JARVIS.ipa for a real iPhone and attaches it to the run.
#            Sideloadly (Windows) signs it with your Apple ID and installs it; free IDs re-sign every 7 days.
#
# Compile errors show in the run log; that is the whole point of the first few runs.
#
# The Xcode project is generated from project.yml on every run (XcodeGen), because the app now has a widget extension
# and a target cannot be added to a checked-in project by hand without Xcode.
name: iOS

on:
  push:
  workflow_dispatch:

jobs:
  test:
    runs-on: macos-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Generate the project
        run: brew install xcodegen && xcodegen generate

      - name: Toolchain
        run: xcodebuild -version && xcrun simctl list runtimes

      - name: Pick a simulator
        id: sim
        run: |
          id=$(xcrun simctl list devices available -j | python3 -c '
          import json, sys
          devices = json.load(sys.stdin)["devices"]
          ios = sorted((r for r in devices if "iOS" in r), reverse=True)
          for runtime in ios:
              for d in devices[runtime]:
                  if d["name"].startswith("iPhone"):
                      print(d["udid"]); sys.exit()
          ')
          echo "Using $id"
          echo "id=$id" >> "$GITHUB_OUTPUT"

      - name: Build and test
        run: |
          set -o pipefail
          xcodebuild test \
            -project JARVIS.xcodeproj -scheme JARVIS \
            -destination "id=${{ steps.sim.outputs.id }}" \
            CODE_SIGNING_ALLOWED=NO 2>&1 | tee build.log || {
              # Compiler errors are re-emitted as annotations, which the API shows without signing in.
              grep -E "error:|failed \(" build.log | sort -u | head -40 | while IFS= read -r line; do echo "::error::$line"; done
              exit 1
            }

  ipa:
    runs-on: macos-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Generate the project
        run: brew install xcodegen && xcodegen generate

      - name: Build for iPhone (unsigned)
        run: |
          set -o pipefail
          xcodebuild build \
            -project JARVIS.xcodeproj -scheme JARVIS \
            -configuration Release -sdk iphoneos \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" 2>&1 | tee build.log || {
              grep -E "error:" build.log | sort -u | head -40 | while IFS= read -r line; do echo "::error::$line"; done
              exit 1
            }

      - name: Package
        run: |
          mkdir -p Payload
          cp -R build/Build/Products/Release-iphoneos/JARVIS.app Payload/
          # The widget and Control Centre buttons ship inside the app; a build without them is not the app.
          test -d Payload/JARVIS.app/PlugIns/JARVISWidgets.appex || { echo "The widget extension is missing from the app"; exit 1; }
          ls Payload/JARVIS.app/PlugIns
          zip -qry JARVIS.ipa Payload

      - uses: actions/upload-artifact@v4
        with:
          name: JARVIS-unsigned-ipa
          path: JARVIS.ipa
          retention-days: 14
