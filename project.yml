# XcodeGen project: on a Mac, `brew install xcodegen`, then `xcodegen generate` in this folder, then open JARVIS.xcodeproj.
name: JARVIS
options:
  bundleIdPrefix: uk.jarvis
  deploymentTarget:
    iOS: "26.0"
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: "5.0"
    TARGETED_DEVICE_FAMILY: "1"          # iPhone only
    DEVELOPMENT_TEAM: ""                 # set your Apple ID team in Xcode › Signing & Capabilities
    CODE_SIGN_STYLE: Automatic
    ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
    ENABLE_USER_SCRIPT_SANDBOXING: YES
targets:
  JARVIS:
    type: application
    platform: iOS
    sources:
      - path: JARVIS
    info:
      path: JARVIS/Info.plist
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: uk.jarvis.phone
        INFOPLIST_FILE: JARVIS/Info.plist
        GENERATE_INFOPLIST_FILE: NO
        SUPPORTS_MACCATALYST: NO
